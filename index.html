<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RV Patch Command</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="phone">

    <!-- Progress -->

    <div class="progress">

        <div class="step active">🧰</div>
        <div class="line"></div>

        <div class="step">🚐</div>
        <div class="line"></div>

        <div class="step">🏕️</div>
        <div class="line"></div>

        <div class="step">✅</div>

    </div>



    <!-- Permanent Job Header -->

   <header class="jobHeader">

    <h1>RV Patch Command</h1>

    <h2 id="customerName">Select an appointment</h2>

    <p class="coach" id="vehicleInfo">
        RV information not yet connected
    </p>

    <p class="repair" id="repairDescription">
        Select an appointment
    </p>

    <hr>

    <p class="address" id="jobAddress">
        📍 Select an appointment
    </p>

    <div class="quickActions">

        <button id="callButton">
            📞 CALL
        </button>

        <button id="textButton">
            💬 TEXT
        </button>

        <button id="navigateButton">
            🧭 NAVIGATE
        </button>

    </div>

</header>


    <!-- Workspace -->

    <main id="workspace">

                <!-- SCHEDULE -->

        <section id="scheduleScreen" class="screen hidden">

            <div class="status">
                📅 SCHEDULE
            </div>

            <h2>Today's Appointments</h2>

            <div id="appointments">
                Loading appointments...
            </div>

            <button class="nextButton"
                onclick="showScreen('homeScreen')">

                ← BACK

            </button>

        </section>



                <!-- HOME -->

        <section id="homeScreen" class="screen">

            <div class="status">

                🟡 PREP

            </div>

            <button class="bigButton"
                onclick="showScreen('scheduleScreen')">

                📅 SCHEDULE

            </button>

           <button class="bigButton"
    onclick="showScreen('prepScreen')">

    🧰 PREP

</button>

        </section>



       <!-- PREP -->

<section id="prepScreen" class="screen hidden">

    <div class="status">
        🟡 PREP
    </div>

    <h2>🧰 Prep Checklist</h2>

    <label>
        <input type="checkbox"
               data-prep="prep"
               data-item="Solar Vent Covers">
        Solar Vent Covers
    </label>

    <label>
        <input type="checkbox"
               data-prep="prep"
               data-item="Ladder">
        Ladder
    </label>

    <label>
        <input type="checkbox"
               data-prep="prep"
               data-item="Gloves">
        Gloves
    </label>

    <button class="nextButton"
            onclick="showScreen('homeScreen')">

        ← BACK

    </button>

    <button class="nextButton"
            onclick="showScreen('driveScreen')">

        READY → 

    </button>

</section>



        <!-- DRIVE -->

<section id="driveScreen" class="screen hidden">

    <div class="status">

        🔵 DRIVE

    </div>

    <h2>On the Way</h2>

    <p class="address" id="driveAddress">
        📍 No address selected
    </p>

    <button class="bigButton"
        id="driveNavigateButton">

        🧭 NAVIGATE

    </button>

    <button class="nextButton"
        onclick="showScreen('prepScreen')">

        ← BACK

    </button>

    <button class="nextButton"
        onclick="showScreen('onsiteScreen')">

        ARRIVED →

    </button>

</section>



        <!-- ON SITE -->

        <section id="onsiteScreen" class="screen hidden">

            <div class="status">

                🟢 ON SITE

            </div>

            <button class="bigButton">

                ▶ START WORK

            </button>

            <button class="nextButton"
    onclick="showScreen('driveScreen')">

    ← BACK

</button>

<button class="nextButton"
    onclick="showScreen('finishScreen')">

    NEXT →

</button>

        </section>



        <!-- FINISH -->

        <section id="finishScreen" class="screen hidden">

            <div class="status">

                ⚫ COMPLETE

            </div>

            <button class="bigButton">

                📷 Photos

            </button>

            <button class="bigButton">

                📝 Notes

            </button>

            <button class="bigButton">

                ✔ Finish Job

            </button>

        </section>

    </main>

</div>

<script src="app.js"></script>

</body>

</html>
