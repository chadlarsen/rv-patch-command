<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RV Patch Command</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="phone">

    <!-- Progress -->

    <div class="progress">

        <div class="step active">🧰</div>
        <div class="line"></div>

        <div class="step">🚐</div>
        <div class="line"></div>

        <div class="step">🏕️</div>
        <div class="line"></div>

        <div class="step">✅</div>

    </div>



    <!-- Permanent Job Header -->

    <header class="jobHeader">

        <h1>RV Patch Command</h1>

        <h2>Kelly Haviland</h2>

        <p class="coach">

            2020 Jayco Whitehawk

        </p>

        <p class="repair">

            Solar Vent Cover Installation

        </p>

        <hr>

        <p class="address">

            📍 123 Main Street<br>

            Salt Lake City, UT

        </p>

        <div class="quickActions">

            <button>📞 CALL</button>

            <button>💬 TEXT</button>

            <button>🧭 NAVIGATE</button>

        </div>

    </header>



    <!-- Workspace -->

    <main id="workspace">



        <!-- HOME -->

        <section id="homeScreen" class="screen">

            <div class="status">

                🟡 PREP

            </div>

            <button class="bigButton"
                onclick="showScreen('partsScreen')">

                🧰 PREP

            </button>

        </section>



        <!-- PARTS -->

        <section id="partsScreen" class="screen hidden">

            <h2>📦 Parts</h2>

            <label><input type="checkbox"> Solar Vent Covers</label>

            <label><input type="checkbox"> Dicor</label>

            <label><input type="checkbox"> Butyl Tape</label>

            <button class="nextButton"
                onclick="showScreen('toolsScreen')">

                NEXT →

            </button>

        </section>



        <!-- TOOLS -->

        <section id="toolsScreen" class="screen hidden">

            <h2>🔧 Tools</h2>

            <label><input type="checkbox"> Ladder</label>

            <label><input type="checkbox"> Drill</label>

            <label><input type="checkbox"> Impact</label>

            <label><input type="checkbox"> Caulk Gun</label>

            <button class="nextButton"
                onclick="showScreen('consumablesScreen')">

                NEXT →

            </button>

        </section>



        <!-- CONSUMABLES -->

        <section id="consumablesScreen" class="screen hidden">

            <h2>🧴 Consumables</h2>

            <label><input type="checkbox"> Gloves</label>

            <label><input type="checkbox"> Alcohol Wipes</label>

            <label><input type="checkbox"> Paper Towels</label>

            <button class="nextButton"
                onclick="showScreen('driveScreen')">

                NEXT →

            </button>

        </section>



        <!-- DRIVE -->

        <section id="driveScreen" class="screen hidden">

            <div class="status">

                🔵 DRIVE

            </div>

            <button class="bigButton">

                🧭 NAVIGATE

            </button>

            <button class="nextButton"
                onclick="showScreen('onsiteScreen')">

                ARRIVED →

            </button>

        </section>



        <!-- ON SITE -->

        <section id="onsiteScreen" class="screen hidden">

            <div class="status">

                🟢 ON SITE

            </div>

            <button class="bigButton">

                ▶ START WORK

            </button>

            <button class="nextButton"
                onclick="showScreen('finishScreen')">

                NEXT →

            </button>

        </section>



        <!-- FINISH -->

        <section id="finishScreen" class="screen hidden">

            <div class="status">

                ⚫ COMPLETE

            </div>

            <button class="bigButton">

                📷 Photos

            </button>

            <button class="bigButton">

                📝 Notes

            </button>

            <button class="bigButton">

                ✔ Finish Job

            </button>

        </section>

    </main>

</div>

<script src="app.js"></script>

</body>

</html>
